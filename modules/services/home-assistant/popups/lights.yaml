# Lights Popup
type: custom:bubble-card
card_type: pop-up
hash: "#lights-popup"
name: Active Lights
icon: fp:lamp
styles: |
  .bubble-pop-up-container {
    background: var(--card-background-color);
  }
cards:
  - type: custom:auto-entities
    card:
      type: entities
      title: Lights On
    filter:
      include:
        - domain: light
          state: "on"
          options:
            icon: fp:lamp
    sort:
      method: friendly_name
