# Media Popup
type: custom:bubble-card
card_type: pop-up
hash: "#media-popup"
name: Active Media
icon: fp:tv
styles: |
  .bubble-pop-up-container {
    background: var(--card-background-color);
  }
cards:
  - type: custom:auto-entities
    card:
      type: entities
      title: Media Playing
    filter:
      include:
        - domain: media_player
          state: playing
          attributes:
            device_class: tv
          options:
            icon: fp:tv
        - domain: media_player
          state: playing
          options:
            icon: fp:speaker
    # A TV matches both rules. Sorting is stable, so its first match, the
    # TV rule, is the one kept.
    unique: entity
    sort:
      method: friendly_name
