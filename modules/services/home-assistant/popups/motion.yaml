# Motion Popup
type: custom:bubble-card
card_type: pop-up
hash: "#motion-popup"
name: Active Motion
icon: fp:motion
styles: |
  .bubble-pop-up-container {
    background: var(--card-background-color);
  }
cards:
  - type: custom:auto-entities
    card:
      type: entities
      title: Motion Detected
    filter:
      include:
        - domain: binary_sensor
          attributes:
            device_class: motion
          state: "on"
          options:
            icon: fp:motion
        - domain: binary_sensor
          attributes:
            device_class: occupancy
          state: "on"
          options:
            icon: fp:motion
    sort:
      method: friendly_name
