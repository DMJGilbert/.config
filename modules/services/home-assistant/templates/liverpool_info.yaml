|
  [[[
    const sensors = ['sensor.liverpool', 'sensor.liverpool_cl', 'sensor.liverpool_fa', 'sensor.liverpool_lc'];
    let nextMatch = null;
    let nextDate = null;

    for (const sensor of sensors) {
      const s = states[sensor];
      // PRE is upcoming and IN is in play; POST, BYE and the rest carry a
      // past date that would win the earliest-date comparison.
      if (s && (s.state === 'PRE' || s.state === 'IN') && s.attributes.date) {
        const matchDate = new Date(s.attributes.date);
        if (!nextDate || matchDate < nextDate) {
          nextDate = matchDate;
          nextMatch = s;
        }
      }
    }

    const icon = '<ha-icon icon="fp:football" style="--mdc-icon-size: 18px; margin-right: 8px; vertical-align: middle;"></ha-icon>';

    if (!nextMatch) return icon + 'No upcoming fixtures';

    // Team names come from the TeamTracker feed and are rendered as HTML.
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    const opponent = esc(nextMatch.attributes.opponent_long_name || nextMatch.attributes.opponent_name || 'TBD');
    const homeAway = nextMatch.attributes.team_homeaway;

    const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const dayName = days[nextDate.getDay()];
    const time = nextDate.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

    const matchup = homeAway === 'home' ? `Liverpool v ${opponent}` : `${opponent} v Liverpool`;

    return `${icon}<b>${matchup}</b>: ${dayName} ${time}`;
  ]]]
