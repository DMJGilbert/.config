|
  [[[
    const weather = entity;
    if (!weather) return '<ha-icon icon="fp:weather-cloudy" style="--mdc-icon-size: 18px; margin-right: 8px; vertical-align: middle;"></ha-icon>Weather unavailable';

    const condition = weather.state.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    const temp = weather.attributes.temperature;
    const humidity = weather.attributes.humidity || 0;

    const iconMap = {
      'clear-night': 'fp:weather-night',
      'cloudy': 'fp:weather-cloudy',
      'fog': 'fp:weather-fog',
      'hail': 'fp:weather-hail',
      'lightning': 'fp:weather-lightning',
      'lightning-rainy': 'fp:weather-lightning-rainy',
      'partlycloudy': 'fp:weather-partly-cloudy',
      'pouring': 'fp:weather-pouring',
      'rainy': 'fp:weather-rainy',
      'snowy': 'fp:weather-snowy',
      'snowy-rainy': 'fp:weather-snowy-rainy',
      'sunny': 'fp:weather-sunny',
      'windy': 'fp:weather-windy',
      'windy-variant': 'fp:weather-windy-variant',
      'exceptional': 'fp:alert'
    };
    const icon = iconMap[weather.state] || 'fp:weather-cloudy';

    return `<ha-icon icon="${icon}" style="--mdc-icon-size: 18px; margin-right: 8px; vertical-align: middle;"></ha-icon><b>${condition}</b> (${humidity}% humidity, ${temp}°C)`;
  ]]]
