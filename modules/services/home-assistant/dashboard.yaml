  - !include /var/lib/hass/views/room-living-room.yaml
  - !include /var/lib/hass/views/room-bedroom.yaml
  - !include /var/lib/hass/views/room-kitchen.yaml
  - !include /var/lib/hass/views/room-bathroom.yaml
  - !include /var/lib/hass/views/room-hallway.yaml
  - !include /var/lib/hass/views/room-girls-room.yaml
