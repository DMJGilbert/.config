name: Update Flake Inputs

on:
  schedule:
    - cron: "0 6 * * 0" # Weekly on Sunday at 6am UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update-flake:
    name: Update flake.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v21

      - uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Snapshot flake.lock before update
        run: cp flake.lock flake.lock.bak

      - name: Update flake inputs
        run: nix flake update

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet flake.lock; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate per-input change summary
        if: steps.changes.outputs.changed == 'true'
        id: summary
        run: |
          {
            echo "summary<<SUMMARY_EOF"
            python3 - flake.lock.bak flake.lock <<'PYEOF'
          import json, sys, datetime

          before_path, after_path = sys.argv[1], sys.argv[2]
          with open(before_path) as f: before = json.load(f)
          with open(after_path)  as f: after  = json.load(f)

          def index(lock):
              out = {}
              for name, node in lock["nodes"].items():
                  if name == "root":
                      continue
                  locked = node.get("locked")
                  if not locked:
                      continue
                  out[name] = {
                      "rev": (locked.get("rev") or "")[:7],
                      "lastModified": locked.get("lastModified", 0),
                  }
              return out

          b, a = index(before), index(after)
          names = sorted(set(b) | set(a))

          rows = []
          for name in names:
              bn, an = b.get(name), a.get(name)
              if not bn:
                  rows.append((name, "_(new)_", f"`{an['rev']}`"))
                  continue
              if not an:
                  rows.append((name, f"`{bn['rev']}`", "_(removed)_"))
                  continue
              if bn["rev"] == an["rev"]:
                  continue
              dt_b = datetime.date.fromtimestamp(bn["lastModified"]).isoformat() if bn["lastModified"] else "?"
              dt_a = datetime.date.fromtimestamp(an["lastModified"]).isoformat() if an["lastModified"] else "?"
              rows.append((name, f"`{bn['rev']}` ({dt_b})", f"`{an['rev']}` ({dt_a})"))

          if not rows:
              print("_No input revisions changed._")
          else:
              print("| Input | Before | After |")
              print("| --- | --- | --- |")
              for r in rows:
                  print(f"| {r[0]} | {r[1]} | {r[2]} |")
          PYEOF
            echo "SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update flake inputs"
          title: "chore(deps): update flake inputs"
          body: |
            Automated weekly flake input updates.

            ## Changed inputs

            ${{ steps.summary.outputs.summary }}

            ## Checklist

            - [ ] Review per-input bumps above
            - [ ] Ensure CI passes
            - [ ] If `nixpkgs` bumped, scan release notes for breaking changes
            - [ ] Test locally if needed: `nix flake check && nh darwin switch .#ryukyu`

            <details><summary>Full lockfile diff</summary>

            ```diff
            (run `git diff flake.lock` locally for the byte-level diff — omitted here to keep PR bodies under GitHub's size limit)
            ```

            </details>
          branch: chore/update-flake-inputs
          delete-branch: true
          labels: |
            dependencies
            automated
