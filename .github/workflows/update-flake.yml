name: Update Flake Inputs

on:
  schedule:
    - cron: "0 6 * * 0" # Weekly on Sunday at 6am UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update-flake:
    name: Update flake.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21

      # magic-nix-cache was deprecated and stopped working on 2025-02-01 when
      # GitHub retired the cache API it relied on. cache-nix-action uses the
      # current Actions cache and needs no external account.
      - uses: nix-community/cache-nix-action@8351fb9f51c580c96c509987ebb99e38aed956ce # v5.2.1
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 604800

      - name: Snapshot flake.lock before update
        run: cp flake.lock flake.lock.bak

      - name: Update flake inputs
        run: nix flake update

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet flake.lock; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate per-input change summary
        if: steps.changes.outputs.changed == 'true'
        id: summary
        run: |
          {
            echo "summary<<SUMMARY_EOF"
            python3 - flake.lock.bak flake.lock <<'PYEOF'
          import json, sys, datetime

          before_path, after_path = sys.argv[1], sys.argv[2]
          with open(before_path) as f: before = json.load(f)
          with open(after_path)  as f: after  = json.load(f)

          def index(lock):
              out = {}
              for name, node in lock["nodes"].items():
                  if name == "root":
                      continue
                  locked = node.get("locked")
                  if not locked:
                      continue
                  out[name] = {
                      "rev": (locked.get("rev") or "")[:7],
                      "lastModified": locked.get("lastModified", 0),
                  }
              return out

          b, a = index(before), index(after)
          names = sorted(set(b) | set(a))

          rows = []
          for name in names:
              bn, an = b.get(name), a.get(name)
              if not bn:
                  rows.append((name, "_(new)_", f"`{an['rev']}`"))
                  continue
              if not an:
                  rows.append((name, f"`{bn['rev']}`", "_(removed)_"))
                  continue
              if bn["rev"] == an["rev"]:
                  continue
              dt_b = datetime.date.fromtimestamp(bn["lastModified"]).isoformat() if bn["lastModified"] else "?"
              dt_a = datetime.date.fromtimestamp(an["lastModified"]).isoformat() if an["lastModified"] else "?"
              rows.append((name, f"`{bn['rev']}` ({dt_b})", f"`{an['rev']}` ({dt_a})"))

          if not rows:
              print("_No input revisions changed._")
          else:
              print("| Input | Before | After |")
              print("| --- | --- | --- |")
              for r in rows:
                  print(f"| {r[0]} | {r[1]} | {r[2]} |")
          PYEOF
            echo "SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

      # PRs opened with GITHUB_TOKEN do not trigger `on: pull_request`, so
      # ci.yml never runs against this branch. Validate here instead, otherwise
      # the "Ensure CI passes" checklist item below is unsatisfiable and input
      # bumps can merge unvalidated.
      - name: Flake check the updated inputs
        if: steps.changes.outputs.changed == 'true'
        run: nix flake check

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update flake inputs"
          title: "chore(deps): update flake inputs"
          body: |
            Automated weekly flake input updates.

            ## Changed inputs

            ${{ steps.summary.outputs.summary }}

            ## Checklist

            - [ ] Review per-input bumps above
            - [x] `nix flake check` passed in the update job (PRs opened with
                  `GITHUB_TOKEN` cannot trigger `ci.yml`, so it runs there)
            - [ ] If `nixpkgs` bumped, scan release notes for breaking changes
            - [ ] Test locally if needed: `nix flake check && nh darwin switch .#ryukyu`

            <details><summary>Full lockfile diff</summary>

            ```diff
            (run `git diff flake.lock` locally for the byte-level diff — omitted here to keep PR bodies under GitHub's size limit)
            ```

            </details>
          branch: chore/update-flake-inputs
          delete-branch: true
          labels: |
            dependencies
            automated
