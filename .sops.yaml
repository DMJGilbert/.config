# SOPS configuration for encrypted secrets
#
# Setup instructions:
# 1. Generate an age key: age-keygen -o ~/.config/sops/age/keys.txt
# 2. Get your public key: age-keygen -y ~/.config/sops/age/keys.txt
# 3. Replace YOUR_AGE_PUBLIC_KEY_HERE with your actual public key
# 4. Create secrets/claude.yaml with your API keys
# 5. Encrypt: sops -e -i secrets/claude.yaml
#
# To edit secrets: sops secrets/claude.yaml

keys:
  # Darren's personal key (~/.config/sops/age/keys.txt). Used on ryukyu, and
  # for editing secrets from a laptop.
  - &darren age1t0xygdnmfynt05td76zwth6hwrjj05jm39elmayasqvdpgdh9y3q2zz8g3
  # rubecula's SSH host key, converted with ssh-to-age. Added so the server can
  # decrypt its own secrets without reaching into /home — previously the only
  # recipient was &darren, which made `sops.age.sshKeyPaths` dead config and
  # left DARREN_PASSWORD (backing hashedPasswordFile) dependent on a key inside
  # a user home directory on a host intended to run impermanent.
  #
  # This MUST be rubecula's own host key. The authoritative value is what
  # sops-install-secrets logs at activation:
  #   'Imported /etc/ssh/ssh_host_ed25519_key as age key with fingerprint ...'
  # Deriving it on a different machine yields a different key and decryption
  # fails with 'Error getting data key: 0 successful groups required, got 0'.
  - &rubecula age1rje6vv9xmkclq5w9f7pet08z5d3ykpzj9aluxjsje9gggmsqwfzs23f4nm

creation_rules:
  # Both files are decrypted on rubecula: secrets/rubecula.yaml for system
  # services, and secrets/claude.yaml for HASS_TOKEN_SYSTEM (machines/rubecula-sops.nix)
  # plus the user-level secrets in users/darren/sops.nix.
  - path_regex: secrets/.*\.yaml$
    key_groups:
      - age:
          - *darren
          - *rubecula
